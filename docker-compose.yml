services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopfront
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - shopfront-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopfront"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Shopfront: Host=db;Port=5432;Database=shopfront;Username=postgres;Password=postgres

volumes:
  shopfront-data:
